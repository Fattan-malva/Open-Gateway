<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">Open Gateway — gateway lokal model AI ke platform chat</title>
  <desc id="d">Banner Open Gateway monokrom: tile logo (sama seperti public/favicon.svg) dengan simpul berdenyut, judul besar di tengah, tagline multi-platform, dan chip fitur Multi-provider, Discord, WhatsApp, Internet, Gambar, Voice, Web UI lokal.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
      <animate attributeName="x1" values="0;0.3;0" dur="20s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>

    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c9cf"/>
    </linearGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="470" rx="26" fill="url(#bg)"/>
  <circle cx="250" cy="110" r="280" fill="url(#glowA)">
    <animate attributeName="cx" values="250;330;250" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;165;110" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="330" r="300" fill="url(#glowB)">
    <animate attributeName="cx" values="1040;960;1040" dur="21s" repeatCount="indefinite"/>
  </circle>
  <rect width="1280" height="470" rx="26" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- orbit netral di belakang tile logo -->
  <g transform="translate(640,136)">
    <g opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <circle r="104" fill="none" stroke="url(#ring)" stroke-width="1.5" stroke-dasharray="5 15"/>
      <circle cx="0" cy="-104" r="4" fill="#ffffff" fill-opacity="0.55"/>
      <circle cx="90" cy="52" r="3" fill="#ffffff" fill-opacity="0.35"/>
      <circle cx="-90" cy="52" r="3" fill="#ffffff" fill-opacity="0.25"/>
    </g>
    <circle r="90" fill="#ffffff" fill-opacity="0.05">
      <animate attributeName="r" values="86;98;86" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.08;0.02;0.08" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tile logo: identik dengan public/favicon.svg (hitam, glyph #ededed), ditambah animasi -->
  <g transform="translate(582,78)">
    <rect width="116" height="116" rx="26" fill="#000000"/>
    <rect x="1" y="1" width="114" height="114" rx="25" fill="none" stroke="url(#tileEdge)" stroke-width="2"/>
    <g transform="scale(3.625)">
      <g stroke="#ededed" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="4 3">
        <path d="M16 16 L16 8">
          <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.6s" repeatCount="indefinite"/>
        </path>
        <path d="M16 16 L8.5 21">
          <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
        </path>
        <path d="M16 16 L23.5 21">
          <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.6s" begin="1s" repeatCount="indefinite"/>
        </path>
      </g>
      <g fill="#ededed">
        <circle cx="16" cy="16" r="3.6">
          <animate attributeName="r" values="3.6;4.3;3.6" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="16" cy="8" r="2.4">
          <animate attributeName="r" values="2.4;3.1;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="8.5" cy="21" r="2.4">
          <animate attributeName="r" values="2.4;3.1;2.4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="23.5" cy="21" r="2.4">
          <animate attributeName="r" values="2.4;3.1;2.4" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="300" font-size="86" font-weight="700" letter-spacing="-1.5" fill="url(#title)">Open Gateway</text>
    <text x="640" y="360" font-size="20" fill="#9f9fa8">Model AI OpenAI-compatible masuk ke Discord, WhatsApp, dan platform chat lain</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#d4d4d8">
    <g>
      <rect x="289" y="398" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="354" y="418">Multi-provider</text>
    </g>
    <g>
      <rect x="429" y="398" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="469" y="418">Discord</text>
    </g>
    <g>
      <rect x="519" y="398" width="88" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="563" y="418">WhatsApp</text>
    </g>
    <g>
      <rect x="617" y="398" width="82" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="658" y="418">Internet</text>
    </g>
    <g>
      <rect x="709" y="398" width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="747" y="418">Gambar</text>
    </g>
    <g>
      <rect x="795" y="398" width="68" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="829" y="418">Voice</text>
    </g>
    <g>
      <rect x="873" y="398" width="118" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="932" y="418">Web UI lokal</text>
    </g>
  </g>

  <!-- sapuan kilau netral -->
  <g opacity="0.09">
    <animateTransform attributeName="transform" type="translate" values="-560 0;1340 0;1340 0" keyTimes="0;0.45;1" dur="8s" repeatCount="indefinite"/>
    <rect x="0" y="-60" width="140" height="600" fill="#ffffff" transform="skewX(-18)"/>
  </g>

  <text x="1240" y="44" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#71717a">v2.0.0 · local-first · multi-platform</text>
</svg>
