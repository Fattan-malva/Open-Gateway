<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · Open Gateway</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="/assets/theme.js"></script>
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); }
    .login-shell { width:min(100%, 420px); margin:auto; }
    .login { padding:36px; border:1px solid var(--border); box-shadow:0 24px 70px rgba(0,0,0,.10); }
    .login-brand { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:30px; }
    .login-logo { width:72px; height:72px; border-radius:16px; margin-bottom:18px; box-shadow:0 10px 24px rgba(0,0,0,.16); }
    .login-brand h1 { margin:0; font-size:25px; letter-spacing:-.04em; }
    .login-subtitle { margin:7px 0 0; }
    .login form { display:grid; gap:16px; margin-top:24px; }
    .login .field input { width:100%; height:42px; box-sizing:border-box; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); padding:0 12px; font:inherit; outline:none; transition:border-color .15s ease, box-shadow .15s ease; }
    .login .field input:focus { border-color:var(--text-faint); box-shadow:0 0 0 3px var(--ring); }
    .login .btn { width:100%; justify-content:center; margin-top:4px; }
    .error { color:var(--danger, #b42318); min-height:20px; font-size:13px; }
    .login-footer { display:flex; justify-content:space-between; align-items:center; margin-top:24px; }
    .theme-toggle { border:0; background:transparent; color:var(--text-dim); cursor:pointer; padding:6px; }
    @media (max-width:480px) { .login { padding:26px 22px; } .login-logo { width:64px; height:64px; } }
  </style>
</head>
<body>
  <main class="card login login-shell">
    <div class="login-brand">
      <img class="login-logo" src="/favicon.svg" alt="Open Gateway" />
      <div><h1>Open Gateway</h1><p class="muted login-subtitle">Login untuk membuka dashboard admin.</p></div>
    </div>
    <form id="form">
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required /></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
      <div class="error" id="error"></div>
      <button class="btn primary" type="submit">Masuk</button>
    </form>
  </main>
  <script>
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); error.textContent = '';
      const data = Object.fromEntries(new FormData(form));
      const response = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
      if (response.ok) location.href = '/app';
      else error.textContent = 'Username atau password salah.';
    });
  </script>
</body>
</html>
